[package]
name = "rinadown_ui_app"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "rinadown-desktop"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
directories = "6"
rinadown_protocol = { version = "0.1.0", path = "../../native/protocol" }
rinadown_ui_account = { version = "0.1.0", path = "../account" }
rinadown_ui_downloads = { path = "../downloads" }
rinadown_ui_extensions = { version = "0.1.0", path = "../extensions" }
rinadown_ui_i18n = { path = "../i18n" }
rinadown_ui_rss = { version = "0.1.0", path = "../rss" }
rinadown_ui_settings = { path = "../settings" }
rinadown_ui_shell = { path = "../shell" }
rinadown_ui_theme = { path = "../theme" }
futures-util = "0.3.32"
gpui.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
gpui_platform.workspace = true
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "sync", "process", "time", "net", "macros", "fs"] }
tokio-tungstenite = "0.29"

[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true
